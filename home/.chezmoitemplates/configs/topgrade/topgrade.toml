[misc]
{{ $managed := and (eq .chezmoi.os "linux") (hasKey . "ManagedByNimbus") .ManagedByNimbus }}
{{ $zeron := and (eq .chezmoi.os "linux") (hasKey . "profiles") (has "development" .profiles) }}
{{ if $managed }}
# Nimbus owns the system phase; its failure stops all later updates.
only = ["mise", "github_cli_extensions", "sheldon", "tldr", "custom_commands"]
{{ else if eq .chezmoi.os "linux" }}
only = ["system", "flatpak", "mise", "github_cli_extensions", "sheldon", "tldr"{{ if $zeron }}, "custom_commands"{{ end }}]
{{ else }}
only = ["brew_formula", "brew_cask", "mise", "github_cli_extensions", "sheldon", "tldr"]
{{ end }}
first = ["mise"]
no_self_update = true
pre_sudo = false
sudo_loop = false
assume_yes = false
cleanup = false
ask_retry = true
notify_end = "on_failure"
show_distribution_summary = false

# The native step updates Mise, its plugins, and globally configured tools,
# including the Cargo and npm tools declared through Mise. Topgrade 17.9+
# runs it in a fresh temporary directory, outside the caller's project.
# Keep requested LTS/stable families and do not rewrite managed config versions.
[mise]
bump = false

{{ if $managed }}
[pre_commands]
"Nimbus system updates" = "nimbus upgrade --system"
{{ end }}

{{ if or $managed $zeron }}
[commands]
{{ if $managed }}
"GitHub Copilot" = "if command -v github-copilot-installer >/dev/null 2>&1; then sudo -- github-copilot-installer update; fi"
{{ end }}
{{ if $zeron }}
"Zeron" = "if command -v zeron >/dev/null 2>&1; then zeron update; fi"
{{ end }}
{{ end }}
