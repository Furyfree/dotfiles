# Portable preferences captured from the Fedora VM running Noctalia 5.0.1.
# GUI overrides in ~/.local/state/noctalia/settings.toml take precedence.
[theme]
source = "wallpaper"
wallpaper_scheme = "m3-tonal-spot"

[theme.templates]
enable_builtin_templates = true
enable_community_templates = true
builtin_ids = [
    "btop", "gtk3", "gtk4", "ghostty", "hyprland", "kcolorscheme", "qt",
]
# Starship, Fastfetch and Neovim use Ghostty's ANSI palette. Their catalog
# hooks would rewrite managed configs or install another editor theme plugin.
community_ids = [
    "claude-code", "codex", "opencode", "discord",
    "libreoffice", "obsidian", "vscode", "zed", "heroiclauncher",
    "prismlauncher", "steam", "obs", "zathura", "hyprtoolkit",
    "papirus-icons", "bat", "fzf", "herdr", "lazygit",
]

[wallpaper.default]
path = "/usr/share/noctalia/assets/noctalia-wallpaper.png"

# Enabled on the VM; Noctalia owns downloads from its built-in sources.
[plugins]
enabled = [
    "noctalia/notes",
    "noctalia/screen_recorder",
    "noctalia/timer",
    "noctalia/translator",
    "noctalia/wallhaven",
    "felipeartur/ai-usagebar",
    "harveywuk/airpods",
    "umedbazarov/crashes",
    "tphilippot/git_companion",
    "profidev/hypr-screen-mirror",
    "kenn/keybind-cheatsheet",
    "8bury/lid-guard",
    "8bury/mini-docker",
    "rylos/tailnet",
    "aristides/udiskie",
    "rxtsel/portctl",
    "cleboost/ssh-launcher",
]

# Keep Noctalia's menu; logind ends the explicitly identified login session.
[[shell.session.actions]]
action = "lock"
shortcut = "1"

[[shell.session.actions]]
action = "logout"
shortcut = "2"
command = 'loginctl terminate-session "${XDG_SESSION_ID:?No graphical login session}"'

[[shell.session.actions]]
action = "lock_and_suspend"
shortcut = "3"

[[shell.session.actions]]
action = "reboot"
shortcut = "4"

[[shell.session.actions]]
action = "shutdown"
shortcut = "5"
variant = "destructive"
