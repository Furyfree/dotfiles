# Linux CLI tools, installed with the other Mise tools after Chezmoi apply.
[tools]
"cargo:caligula" = "latest"
# The published tinymist crate is a library; build the CLI from its release.
# Use disk-backed temporary storage instead of Fedora's quota-limited /tmp.
"cargo:https://github.com/Myriad-Dreamin/tinymist" = { version = "tag:v0.15.6", crate = "tinymist-cli", bin = "tinymist", locked = true, install_env = { TMPDIR = "/var/tmp" } }
"cargo:cargo-update" = "latest"
"cargo:sheldon" = "latest"
"cargo:resvg" = "latest"
"cargo:vm-curator" = "latest"

[settings]
# Build through Cargo instead of selecting prebuilt cargo-binstall artifacts.
cargo.binstall = false
