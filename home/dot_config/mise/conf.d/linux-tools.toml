# Linux CLI tools, installed with the other Mise tools after Chezmoi apply.
[tools]
tinymist = "latest"
sheldon = "latest"
resvg = "latest"
"github:ifd3f/caligula" = { version = "latest", bin = "caligula" }
# Upstream publishes Linux x86_64 binaries only.
"github:mroboff/vm-curator" = { version = "latest", os = ["linux/x64"], asset_pattern = "vm-curator-*-linux-x86_64.tar.gz" }
"cargo:ai-usagebar" = "latest"
