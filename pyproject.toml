[project]
name = "dotfiles"
version = "0.1.0"
description = "Chezmoi source for user configuration"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-xdist>=3.8.0",
    "pyyaml>=6.0.3",
    "ruff>=0.16.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Suites are named after their target, e.g. zsh-foundation.py.
python_files = ["*.py"]
addopts = "-n auto -rfEs --import-mode=importlib"

[tool.ruff.lint]
select = [
    "E4", "E7", "E9", "F", "I", "UP", "B",
    "C408", "EXE001", "FURB167", "ISC004", "PLW1510",
]
