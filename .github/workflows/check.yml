name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    container: registry.fedoraproject.org/fedora:44
    steps:
      - name: Install test tools
        run: >-
          dnf5 -y install git just python3 uv chezmoi neovim bash zsh lua
          openssh-clients desktop-file-utils findutils diffutils which ShellCheck
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      # Tests isolate Git config, so the checkout must belong to the container user.
      - name: Own checkout
        run: chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"
      - name: Check with Python 3.14+
        run: just check
